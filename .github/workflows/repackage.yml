name: Repackage Sentry Godot Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream getsentry/sentry-godot release tag, for example 1.6.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  repackage:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Resolve upstream release asset
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          version = os.environ["VERSION"]
          release_api_url = f"https://api.github.com/repos/getsentry/sentry-godot/releases/tags/{version}"
          request = urllib.request.Request(
              release_api_url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(request) as response:
              release = json.load(response)

          asset_pattern = re.compile(rf"^sentry-godot-{re.escape(version)}\+[0-9a-f]+\.zip$")
          matches = [
              asset
              for asset in release.get("assets", [])
              if asset_pattern.fullmatch(asset.get("name", ""))
          ]

          if len(matches) != 1:
              asset_names = ", ".join(asset.get("name", "<unnamed>") for asset in release.get("assets", []))
              print(
                  f"Expected exactly one addon asset matching {asset_pattern.pattern}; "
                  f"found {len(matches)}. Assets: {asset_names}",
                  file=sys.stderr,
              )
              sys.exit(1)

          asset = matches[0]
          asset_name = asset["name"]
          if not asset_name.endswith(".zip"):
              print(f"Resolved asset is not a zip file: {asset_name}", file=sys.stderr)
              sys.exit(1)

          output_name = f"{asset_name[:-4]}-mobile.zip"
          values = {
              "UPSTREAM_TAG": version,
              "UPSTREAM_RELEASE_URL": release.get("html_url", f"https://github.com/getsentry/sentry-godot/releases/tag/{version}"),
              "ASSET_NAME": asset_name,
              "DOWNLOAD_URL": asset["browser_download_url"],
              "OUTPUT_NAME": output_name,
          }

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for key, value in values.items():
                  env_file.write(f"{key}={value}\n")
          PY

      - name: Download upstream addon
        run: |
          curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors \
            --header "Authorization: Bearer ${{ github.token }}" \
            --output "$ASSET_NAME" \
            "$DOWNLOAD_URL"

      - name: Repackage mobile addon
        run: |
          python tools/repackage_sentry_godot.py \
            --input "$ASSET_NAME" \
            --output "$OUTPUT_NAME" \
            --platform android \
            --platform macos \
            --platform ios

      - name: Write release notes
        run: |
          {
            echo "Repackaged from upstream getsentry/sentry-godot release: $UPSTREAM_RELEASE_URL"
            echo
            echo "Only Android, macOS, and iOS bindings are included in this archive."
            echo "Unsupported platform binaries and references were removed from addons/sentry/sentry.gdextension."
          } > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Sentry Godot $UPSTREAM_TAG mobile"

          if gh release view "$UPSTREAM_TAG" >/dev/null 2>&1; then
            gh release edit "$UPSTREAM_TAG" \
              --title "$title" \
              --notes-file release-notes.md
            gh release upload "$UPSTREAM_TAG" "$OUTPUT_NAME" --clobber
          else
            gh release create "$UPSTREAM_TAG" "$OUTPUT_NAME" \
              --title "$title" \
              --notes-file release-notes.md
          fi
