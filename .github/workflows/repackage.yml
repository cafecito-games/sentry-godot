name: Repackage Sentry Godot Release

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional upstream getsentry/sentry-godot release tag, for example 1.6.0"
        required: false
        type: string

permissions:
  contents: write

env:
  GPM_VERSION: "0.5.0"

jobs:
  repackage:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Install gpm
        run: |
          archive="gpm_${GPM_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/cafecito-games/godot-package-manager/releases/download/v$GPM_VERSION"
          curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors -o "$archive" "$base/$archive"
          curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors -o checksums.txt "$base/checksums.txt"
          grep " $archive\$" checksums.txt | sha256sum --check -
          tar -xzf "$archive" gpm
          install -m 0755 gpm /usr/local/bin/gpm
          rm -f "$archive" checksums.txt gpm
          gpm --version

      - name: Run packaging self-test
        run: scripts/test-package-addon

      - name: Fetch release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          if [ -n "$VERSION" ]; then
            gh api "repos/getsentry/sentry-godot/releases/tags/$VERSION" > upstream-release.json
          else
            gh api --paginate --slurp "repos/getsentry/sentry-godot/releases?per_page=100" > upstream-releases.json
            gh release list --limit 1000 --json tagName > local-releases.json
          fi

      - name: Resolve upstream release asset
        env:
          VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          if [ -n "$VERSION" ]; then
            python tools/resolve_upstream_release.py \
              --release-json upstream-release.json \
              --version "$VERSION" \
              --github-env "$GITHUB_ENV"
          else
            python tools/resolve_upstream_release.py \
              --upstream-releases-json upstream-releases.json \
              --local-releases-json local-releases.json \
              --github-env "$GITHUB_ENV"
          fi

      - name: Report no new upstream release
        if: env.SHOULD_RELEASE != 'true'
        run: echo "No new upstream Sentry Godot release to sync."

      - name: Download upstream addon
        if: env.SHOULD_RELEASE == 'true'
        run: |
          curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors \
            --header "Authorization: Bearer ${{ github.token }}" \
            --output "$ASSET_NAME" \
            "$DOWNLOAD_URL"

      - name: Package gpm slices
        if: env.SHOULD_RELEASE == 'true'
        run: |
          scripts/package-addon \
            --input "$ASSET_NAME" \
            --version "$UPSTREAM_TAG" \
            --out dist

      - name: Write release notes
        if: env.SHOULD_RELEASE == 'true'
        run: |
          summary="$(python - dist/gpm-index.toml <<'INDEX'
          import sys, tomllib

          with open(sys.argv[1], "rb") as index_file:
              index = tomllib.load(index_file)

          lines = [f"- `{name}`" for name in sorted(index["slices"])]
          for name in sorted(index.get("artifacts", {})):
              lines.append(f"- `shared:{name}`, pulled in automatically by that platform's slices")
          lines.append("")
          lines.append(f'This index is format {index["format"]}.')
          print("\n".join(lines))
          INDEX
          )"

          {
            echo "Repackaged from upstream getsentry/sentry-godot release: $UPSTREAM_RELEASE_URL"
            echo
            echo "Published as gpm slice archives alongside \`gpm-index.toml\`, so a project"
            echo "downloads \`core\` plus only the platforms it declares."
            echo
            echo "Declare it in \`addons.toml\`:"
            echo
            echo '```toml'
            echo '[addons.sentry]'
            echo 'source = "github-release"'
            echo 'repo = "cafecito-games/sentry-godot"'
            echo "version = \"$UPSTREAM_TAG\""
            echo '```'
            echo
            echo "Archives in this release:"
            echo
            echo "$summary"
            echo
            echo "Every platform upstream ships is published. A project downloads the"
            echo "slices it declares plus its own host slice, so nothing here has to be"
            echo "revisited when a project adds an export target."
            echo
            echo "Installing a format 2 index needs gpm 0.5.0 or newer. An older gpm"
            echo "refuses it with \`unsupported index format 2\` rather than installing"
            echo "an incomplete tree."
          } > release-notes.md

      - name: Publish release
        if: env.SHOULD_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Sentry Godot $UPSTREAM_TAG repackaged"

          if gh release view "$UPSTREAM_TAG" >/dev/null 2>&1; then
            gh release edit "$UPSTREAM_TAG" \
              --title "$title" \
              --notes-file release-notes.md

            # A consumer resolves each slice by joining the index's file name to
            # the directory the index came from, so assets from an older cut of
            # this tag are dead weight at best and confusing at worst.
            published="$(ls dist)"
            gh release view "$UPSTREAM_TAG" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              if ! grep -qxF "$asset" <<<"$published"; then
                gh release delete-asset "$UPSTREAM_TAG" "$asset" --yes
              fi
            done

            gh release upload "$UPSTREAM_TAG" dist/* --clobber
          else
            gh release create "$UPSTREAM_TAG" dist/* \
              --title "$title" \
              --notes-file release-notes.md
          fi
