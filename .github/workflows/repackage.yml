name: Repackage Sentry Godot Release

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional upstream getsentry/sentry-godot release tag, for example 1.6.0"
        required: false
        type: string

permissions:
  contents: write

jobs:
  repackage:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Fetch release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          if [ -n "$VERSION" ]; then
            gh api "repos/getsentry/sentry-godot/releases/tags/$VERSION" > upstream-release.json
          else
            gh api --paginate --slurp "repos/getsentry/sentry-godot/releases?per_page=100" > upstream-releases.json
            gh release list --limit 1000 --json tagName > local-releases.json
          fi

      - name: Resolve upstream release asset
        env:
          VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          if [ -n "$VERSION" ]; then
            python tools/resolve_upstream_release.py \
              --release-json upstream-release.json \
              --version "$VERSION" \
              --github-env "$GITHUB_ENV"
          else
            python tools/resolve_upstream_release.py \
              --upstream-releases-json upstream-releases.json \
              --local-releases-json local-releases.json \
              --github-env "$GITHUB_ENV"
          fi

      - name: Report no new upstream release
        if: env.SHOULD_RELEASE != 'true'
        run: echo "No new upstream Sentry Godot release to sync."

      - name: Download upstream addon
        if: env.SHOULD_RELEASE == 'true'
        run: |
          curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors \
            --header "Authorization: Bearer ${{ github.token }}" \
            --output "$ASSET_NAME" \
            "$DOWNLOAD_URL"

      - name: Repackage mobile addon
        if: env.SHOULD_RELEASE == 'true'
        run: |
          python tools/repackage_sentry_godot.py \
            --input "$ASSET_NAME" \
            --output "$OUTPUT_NAME" \
            --platform android \
            --platform macos \
            --platform ios

      - name: Write release notes
        if: env.SHOULD_RELEASE == 'true'
        run: |
          {
            echo "Repackaged from upstream getsentry/sentry-godot release: $UPSTREAM_RELEASE_URL"
            echo
            echo "Only Android, macOS, and iOS bindings are included in this archive."
            echo "Unsupported platform binaries and references were removed from addons/sentry/sentry.gdextension."
          } > release-notes.md

      - name: Publish release
        if: env.SHOULD_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Sentry Godot $UPSTREAM_TAG mobile"

          if gh release view "$UPSTREAM_TAG" >/dev/null 2>&1; then
            gh release edit "$UPSTREAM_TAG" \
              --title "$title" \
              --notes-file release-notes.md
            gh release upload "$UPSTREAM_TAG" "$OUTPUT_NAME" --clobber
          else
            gh release create "$UPSTREAM_TAG" "$OUTPUT_NAME" \
              --title "$title" \
              --notes-file release-notes.md
          fi
